[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-onboard"
version = "0.1.0"
description = "Automated catalog onboarding & taxonomy normalization engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "fastapi>=0.100",
  "uvicorn>=0.22",
  "anthropic>=0.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "httpx>=0.24",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["catalog_onboard*"]

[tool.setuptools.package-data]
catalog_onboard = ["rules/*.yaml", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: performance checks, skipped by default (-m slow to run)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
