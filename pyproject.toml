[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gqa-kv-cache"
version = "0.1.0"
description = "Grouped-Query Attention with an explicit KV cache (interview exercise)"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
