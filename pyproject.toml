[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repricer"
version = "0.1.0"
description = "Dynamic competitive pricing & repricing engine"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.0",
  "fastapi>=0.100",
  "uvicorn>=0.22",
  "anthropic>=0.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "httpx>=0.24",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
repricer = "repricer.__main__:main"

[tool.setuptools.packages.find]
include = ["repricer*"]

[tool.setuptools.package-data]
repricer = ["db/*.sql", "db/migrations/*.sql", "rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:repricer.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "catalog_onboard", "shopfeed", "catalog_onboard.egg-info", "shopfeed.egg-info", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["repricer"]

[[tool.mypy.overrides]]
module = ["ulid.*"]
ignore_missing_imports = true
