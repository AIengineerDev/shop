[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopfeed"
version = "0.2.0"
description = "Marketplace search ranking: LambdaMART v1 (see docs/specs/product-ranking-model.md)"
requires-python = ">=3.10"
dependencies = [
  "lightgbm>=4.5",
  "pandas>=2.0",
  "pyarrow>=12",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.5", "hypothesis>=6"]
security = ["pip-audit>=2.7", "bandit>=1.7"]

[tool.setuptools.packages.find]
include = ["shopfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not e2e and not load'"
markers = [
  "integration: module boundaries on a synthetic log (CI job: integration)",
  "e2e: every CLI end to end on a synthetic data root (CI job: e2e)",
  "load: open-loop load against the ranker with SLA gates (CI job: load)",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["shopfeed"]
# Count code run by the e2e CLI subprocesses (pytest-cov >= 7 relies on coverage for this).
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Lint shopfeed/ even when a local .git/info/exclude hides it (CI has no such file).
respect-gitignore = false
extend-exclude = [".venv", "data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
