[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopfeed"
version = "0.1.0"
description = "Shop app feed recommendation system prototype (interview prep)"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "fastapi>=0.100",
  "uvicorn>=0.22",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["shopfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
