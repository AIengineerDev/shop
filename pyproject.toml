[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shopfeed"
version = "0.2.0"
description = "Marketplace search ranking: LambdaMART v1 (see docs/specs/product-ranking-model.md)"
requires-python = ">=3.10"
dependencies = [
  "lightgbm>=4.5",
  "pandas>=2.0",
  "pyarrow>=12",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["shopfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
